# The `trident` environment: Snakemake and every tool the rules call.
# Create it with `bash create_environment.sh`.

name: trident
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # --- Workflow engine --------------------------------------------------------
  - python=3.11.9
  - snakemake-minimal=9.27.0
  - snakefmt=2.0.3
  - go-shfmt=3.13.1            
  - pandas=1.5.3               
  - numpy=1.26.4               

  # --- Preprocess, align, expression ------------------------------------------
  - fastp=1.3.6
  - fastqc=0.12.1
  - star=2.7.7a
  - subread=2.0.3              
  - samtools=1.21
  - multiqc=1.17

  # --- Alternative splicing (rules/splicing.smk) ------------------------------
  - rmats=4.3.0

  # --- APA (rules/apa.smk) -----------------------------------------------------
  - kallisto=0.51.1
  - r-base=4.3.3
  - bioconductor-limma=3.58.1
  - rpy2=3.5.11
  - gtfparse=2.5.0
  - polars=0.20.31
  - pyarrow=16.1.0
  - scipy=1.15.2
  - scikit-learn=1.7.2
  - statsmodels=0.14.6
  - scanpy=1.9.6
  - anndata=0.11.4
  - seaborn=0.12.2
  - matplotlib=3.9.1
  - urllib3=2.5.0

  - pip
  - pip:
    - htseq==2.1.2
    - pysam==0.24.0
